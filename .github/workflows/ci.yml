name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  pack:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # Install the packed tarball and run the CLI from it.
      - run: pnpm pack --pack-destination "$RUNNER_TEMP"
      - run: npm install -g --prefix "$RUNNER_TEMP/prefix" "$RUNNER_TEMP"/fand-glide-*.tgz
      - run: |
          "$RUNNER_TEMP/prefix/bin/glide" --version
          "$RUNNER_TEMP/prefix/bin/glide" build -o "$RUNNER_TEMP/out" examples/demo.md
          test -f "$RUNNER_TEMP/out/index.html"
          test -f "$RUNNER_TEMP/out/glide.js"
